<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Tab icon: the official CGCI seal. The SVG is listed first as a graceful
      fallback, then the PNG artwork, then the Apple touch icon.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/cgci-logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#134533" />
    <title>CGCI Student Portal</title>
    <meta
      name="description"
      content="Sign in to the Core Gateway College Inc. student portal. Secure authentication for registered CGCI students."
    />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 34rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif">
        <h1 style="font-size: 1.25rem">JavaScript is required</h1>
        <p style="margin-top: 0.75rem; color: #4e615a">
          The CGCI Student Portal needs JavaScript enabled to verify your session. Please enable it
          and reload the page, or contact the registrar’s office for assistance.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
